<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN PROJECT </title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: rgb(142, 151, 151);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card{
            background-color: rgb(42, 169, 169);
            border-radius: 8px;
            padding: 10px;
            width: 300px;  
        }
        h2{
            text-align: center;
            margin-bottom: 20px;
            color: #cdc3c3;
        }
        form{
            display: flex;
            flex-direction: column;
            align-items: center;
            /* gap: 10px; */
        }
        input{
            width: 279px;
            margin: 10px;
            padding: 10px;
            border-radius: 5px ;
            border: 1px solid ;
        }
        button{
            width: 50px;
            height: 30px;
            border-radius: 8px;
            border: 1px solid black;
            background-color: blue;
            color: antiquewhite;
        }
        button:hover{
            background-color: rgb(38, 22, 123);
        }
         
    </style>
</head>

<body>
    <div class="card">
        <h2>Login</h2>
        <form>
            <input type="email"  placeholder="Email" required >
            <input type="password"  placeholder="Password" required>
            <button type="submit">login</button>
            

        </form>
    </div>

</body>

</html>
